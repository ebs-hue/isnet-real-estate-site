<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>אירוע חדש | ISNET</title>
  <link rel="stylesheet" href="styles.css?v=20261007-1030">
  <link rel="stylesheet" href="edit.css?v=20261007-1030">
</head>
<body>
<header class="topbar edit-topbar">
  <div>
    <div class="eyebrow">ISNET AI CMS · אירוע חדש</div>
    <h1 id="pageTitle">הוספת אירוע ידנית</h1>
    <p>יצירת טיוטה חדשה במערכת הניהול.</p>
  </div>
  <div class="top-actions">
    <a class="secondary action-link" href="./">חזרה לכל האירועים</a>
  </div>
</header>
<main class="edit-main">
  <div class="notice">האירוע יישמר כרגע כטיוטה מקומית. לאחר חיבור ה־API המאובטח, אותו מסך ישמור ויפרסם למערכת החיה.</div>
  <section class="editor-layout">
    <div class="editor-column">
      <section class="panel edit-card">
        <h2>תוכן האירוע</h2>
        <div class="two">
          <label><span>עיר</span><select id="city"><option value="ashdod">אשדוד</option><option value="rishon-lezion">ראשון לציון</option></select></label>
          <label><span>קטגוריה</span><select id="category"></select></label>
        </div>
        <label><span>כותרת</span><input id="title" type="text" placeholder="שם האירוע"></label>
        <label><span>תקציר קצר</span><textarea id="shortPitch" rows="3"></textarea></label>
        <label><span>על האירוע</span><textarea id="description" rows="10"></textarea></label>
      </section>

      <section class="panel edit-card">
        <h2>מועד ומקום</h2>
        <div class="three">
          <label><span>תאריך</span><input id="startDate" type="date"></label>
          <label><span>שעה</span><input id="startTime" type="time"></label>
          <label><span>מקום</span><input id="venue" type="text"></label>
        </div>
        <label><span>כתובת</span><input id="address" type="text"></label>
      </section>

      <section class="panel edit-card">
        <h2>קישורים ווידאו</h2>
        <label><span>קישור רכישה / פרטים</span><input id="purchaseUrl" type="url" dir="ltr"></label>
        <label><span>YouTube ID</span><input id="youtubeId" type="text" dir="ltr" maxlength="11"></label>
      </section>
    </div>

    <aside class="side-column">
      <section class="panel edit-card media-card">
        <h2>תמונה</h2>
        <div id="imagePreview" class="large-preview"></div>
        <div id="imageState" class="image-state"><span class="tag bad">אין תמונה</span></div>
        <label class="upload-btn">העלאת תמונה<input id="imageFile" type="file" accept="image/*" hidden></label>
        <label><span>קרדיט / מקור</span><input id="imageCredit" type="text"></label>
        <label class="checkbox"><input id="imageApproved" type="checkbox"> <span>התמונה מאושרת לשימוש</span></label>
      </section>

      <section class="panel edit-card">
        <h2>שמירה</h2>
        <button id="saveBtn" class="primary wide">שמור אירוע חדש</button>
        <p class="save-note" id="saveNote">האירוע יישמר כטיוטה במחשב הזה.</p>
      </section>
    </aside>
  </section>
</main>
<script src="new.js?v=20261007-1030"></script>
</body>
</html>
