name: Discover FRIENDS events for Ashdod and Rishon
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * *'
  push:
    paths:
      - 'scripts/discover_friends_events.py'
      - '.github/workflows/friends-discovery.yml'
permissions:
  contents: write
concurrency:
  group: friends-discovery
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Discover candidates without publishing
        run: python scripts/discover_friends_events.py
      - name: Commit private discovery report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/friends-discovery.json
          if ! git diff --cached --quiet; then
            git commit -m "Update FRIENDS discovery candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
