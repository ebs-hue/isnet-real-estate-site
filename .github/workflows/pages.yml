name: Publish priceboard

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assets/**"
      - "data/**"
      - "projects/**"
      - "project-live/**"
      - "יבנה/**"
      - "כרמי-גת/**"
      - ".github/workflows/pages.yml"
      - "scripts/qa-pricebooks.cjs"
      - "package*.json"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for pricebook checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check pricebook behavior before publication
        run: |
          mkdir -p "$RUNNER_TEMP/pricebook-qa"
          cp package.json package-lock.json "$RUNNER_TEMP/pricebook-qa/"
          npm ci --prefix "$RUNNER_TEMP/pricebook-qa" --ignore-scripts --no-audit --no-fund
          NODE_PATH="$RUNNER_TEMP/pricebook-qa/node_modules" node scripts/qa-pricebooks.cjs

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
