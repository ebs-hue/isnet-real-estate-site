name: Audit Ashdod public editorial copy
on:
  workflow_dispatch:
  schedule:
    - cron: "25 3 * * *"
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/audit_ashdod_editorial_copy.py
      - name: Preserve audit in repository
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/editorial-audit-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Ashdod editorial copy audit"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
