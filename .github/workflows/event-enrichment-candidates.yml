name: Build event enrichment candidates from all sources
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * *'
  push:
    paths:
      - 'scripts/build_event_enrichment_candidates.py'
      - '.github/workflows/event-enrichment-candidates.yml'
permissions:
  contents: write
concurrency:
  group: event-enrichment-candidates
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_event_enrichment_candidates.py
      - name: Persist internal candidates only
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/event-enrichment-candidates-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Update cross-source enrichment suggestions for Ashdod events"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
