name: Verify live events admin deployment
on:
  workflow_dispatch:
  push:
    paths:
      - 'events-preview/admin/index.html'
      - 'events-preview/admin/app.js'
      - '.github/workflows/verify-live-events-admin.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare live admin with repository version
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,datetime
          urls={
            'admin_html':'https://isnet.co.il/events-preview/admin/',
            'admin_js':'https://isnet.co.il/events-preview/admin/app.js',
            'github_pages_html':'https://isnet-media.github.io/isnet-real-estate-site/events-preview/admin/',
            'github_pages_js':'https://isnet-media.github.io/isnet-real-estate-site/events-preview/admin/app.js',
            'ashdod_app_js':'https://isnet.co.il/events-preview/ashdod/app.js',
            'ashdod_fallbacks':'https://isnet.co.il/events-preview/ashdod/category-fallbacks.json',
            'ashdod_lecture_image':'https://isnet.co.il/events-preview/ashdod/assets/defaults/lecture.svg',
          }
          result={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'live':{}}
          import socket
          for host in ('isnet.co.il','isnet-media.github.io'):
            try:result.setdefault('dns',{})[host]=sorted({a[4][0] for a in socket.getaddrinfo(host,443)})
            except Exception as ex:result.setdefault('dns',{})[host]='DNS error: '+str(ex)[:80]
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ISNET-Deployment-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=22) as res:
                content=res.read().decode('utf-8','replace')
                result['live'][name]={'http_status':res.status,'bytes':len(content),'sort_order_present':'sortOrder' in content,
                  'imported_date_present':('תאריך העלאה' in content or 'importedLabel' in content),
                  'url':res.url,'headers':{k:res.headers.get(k) for k in ('Server','Cache-Control','Age','Via','X-Cache','CF-Cache-Status')}}
            except Exception as e:
              result['live'][name]={'error':str(e)[:300]}
          result['latest_admin_deployed']=all(result['live'].get(k,{}).get('sort_order_present') for k in ('admin_html','admin_js'))
          result['ashdod_fallback_code_deployed']=result['live'].get('ashdod_app_js',{}).get('bytes',0)>70000 and result['live'].get('ashdod_app_js',{}).get('sort_order_present',False)==False
          result['github_pages_updated']=all(result['live'].get(k,{}).get('sort_order_present') for k in ('github_pages_html','github_pages_js'))
          from pathlib import Path
          p=Path('events-preview/admin/data/live-deployment-check.json');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Persist verification result
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/live-deployment-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Check actual live events admin deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
