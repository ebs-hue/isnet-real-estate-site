name: Verify live events admin deployment
on:
  workflow_dispatch:
  push:
    paths:
      - 'events-preview/admin/index.html'
      - 'events-preview/admin/app.js'
      - '.github/workflows/verify-live-events-admin.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Compare live admin with repository version
        shell: bash
        run: |
          python - <<'PY'
          import json,urllib.request,datetime
          urls={
            'admin_html':'https://isnet.co.il/events-preview/admin/',
            'admin_js':'https://isnet.co.il/events-preview/admin/app.js',
          }
          result={'checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'live':{}}
          for name,url in urls.items():
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'ISNET-Deployment-Verification/1.0','Cache-Control':'no-cache'})
              with urllib.request.urlopen(req,timeout=22) as res:
                content=res.read().decode('utf-8','replace')
                result['live'][name]={'http_status':res.status,'bytes':len(content),'sort_order_present':'sortOrder' in content,
                  'imported_date_present':('תאריך העלאה' in content or 'importedLabel' in content),
                  'url':res.url}
            except Exception as e:
              result['live'][name]={'error':str(e)[:300]}
          result['latest_admin_deployed']=all(x.get('sort_order_present') for x in result['live'].values())
          from pathlib import Path
          p=Path('events-preview/admin/data/live-deployment-check.json');p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
          PY
      - name: Persist verification result
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/live-deployment-check.json
          if ! git diff --cached --quiet; then
            git commit -m "Check actual live events admin deployment"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
