name: Generate Ashdod event thumbnails

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/generate_event_thumbnails.py"
      - ".github/workflows/generate-ashdod-event-thumbnails.yml"
      - "events-preview/ashdod/data/events.json"

permissions:
  contents: write

concurrency:
  group: generate-ashdod-event-thumbnails
  cancel-in-progress: true

jobs:
  thumbnails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Generate 4x3 event thumbnails
        run: python scripts/generate_event_thumbnails.py

      - name: Commit generated thumbnails
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json events-preview/ashdod/assets/event-thumbs
          if git diff --cached --quiet; then
            echo "No thumbnail changes."
            exit 0
          fi
          git commit -m "Generate Ashdod event card thumbnails"
          git pull --rebase origin main
          git push
