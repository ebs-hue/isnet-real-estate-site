name: Pilot editorial event rewrites (read only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pilot-event-rewrites.yml"

permissions:
  contents: write

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EVENT_ENRICHMENT_MODEL: ${{ vars.OPENAI_EVENT_ENRICHMENT_MODEL || 'gpt-5-mini' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests beautifulsoup4
      - name: Generate drafts only, never publish
        run: python -u scripts/pilot_event_rewrites.py
      - name: Save review-only report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/editorial-rewrite-pilot-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Record editorial rewrite pilot drafts for human review"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
