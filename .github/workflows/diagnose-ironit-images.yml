name: Diagnose Ironit event images
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/diagnose_ironit_images.py"
      - "scripts/diagnose_ironit_specific_images.py"
      - ".github/workflows/diagnose-ironit-images.yml"
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/diagnose_ironit_specific_images.py
