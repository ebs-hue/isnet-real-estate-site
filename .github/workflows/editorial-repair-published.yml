name: Repair weak published Ashdod event descriptions

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: editorial-repair-published
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EDITORIAL_REPAIR_LIMIT: "12"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - name: Repair only well-sourced published copy
        run: python -u scripts/editorial_repair_published.py
      - name: Commit review log
        if: always()
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/editorial-repair-report-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Record published-event editorial repair results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
