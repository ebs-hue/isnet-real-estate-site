name: Daily city event intake

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/sync_events_from_sources.py"
      - "scripts/ofek_event_source.py"
      - "scripts/test_ofek_event_source.py"
      - "scripts/test_city_event_intake.py"
      - ".github/workflows/sync-city-events.yml"
  schedule:
    # UTC; approximately 08:10 and 20:10 Israel daylight time.
    - cron: "10 5,17 * * *"

permissions:
  contents: write

concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install calendar readers
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Validate event source adapters
        run: |
          python scripts/test_city_event_intake.py
          python scripts/test_ofek_event_source.py

      - name: Discover and merge future public events
        id: collect
        run: |
          set +e
          python -u scripts/sync_events_from_sources.py
          rc=$?
          echo "code=$rc" >> "$GITHUB_OUTPUT"
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 2 ]; then
            echo "Unexpected ingestion exception (exit code $rc)" >&2
            exit "$rc"
          fi

      - name: Check dataset shape and source audit
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path("events-preview/source-sync-report.json").read_text())
          assert len(report["cities"]) == 2
          for slug, c in report["cities"].items():
              data=json.loads(Path(f"events-preview/{slug}/data/events.json").read_text())
              assert isinstance(data["events"],list) and data["events"]
              assert all(e.get("city")==c["city"] for e in data["events"])
              keys=[e.get("event_id") for e in data["events"]]
              assert len(keys)==len(set(keys)), f"duplicate event IDs: {slug}"
              print(slug,"events",len(keys),"new",c["new"],"updated",c["updated"])
          PY

      - name: Publish datasets and operational source report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json events-preview/rishon-lezion/data/events.json events-preview/source-sync-report.json
          if git diff --cached --quiet; then
            echo "No event data/report changes."
            exit 0
          fi
          git commit -m "Refresh city event data from official source calendars"
          for retry in 1 2 3 4; do
            git fetch origin main
            git rebase origin/main || exit 1
            if git push origin HEAD:main; then
              echo "Event data and audit committed."
              exit 0
            fi
            sleep 3
          done
          echo "Could not publish event source updates" >&2
          exit 1

      - name: Alert on completely unavailable ingestion
        if: always() && steps.collect.outputs.code == '2'
        run: |
          echo "::error::No configured source yielded parseable future events. Inspect events-preview/source-sync-report.json."
          exit 1
