name: Publish confirmed Ashdod stage images
on:
  workflow_dispatch:
  schedule:
    - cron: '35 6 * * *'
  push:
    paths:
      - 'scripts/publish_matched_stage_images.py'
      - '.github/workflows/publish-stage-images.yml'
permissions:
  contents: write
concurrency:
  group: publish-confirmed-stage-images
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Match and publish only exact event images
        env:
          STAGE_MEDIA_PUBLICATION_ENABLED: YES_EXACT_TITLE_DATE_VENUE
        run: python scripts/publish_matched_stage_images.py
      - name: Save approved feed corrections and report
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json events-preview/admin/data/stage-image-publication-ashdod.json
          if ! git diff --cached --quiet; then
            git commit -m "Publish verified stage event images on Ashdod listings"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
