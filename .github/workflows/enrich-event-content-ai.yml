name: Enrich event content with AI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/enrich_event_content_ai.py"
      - ".github/workflows/enrich-event-content-ai.yml"
  workflow_run:
    workflows: ["Daily city event intake"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: isnet-event-data-writes
  cancel-in-progress: false

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_EVENT_ENRICHMENT_MODEL: ${{ vars.OPENAI_EVENT_ENRICHMENT_MODEL || 'gpt-5-mini' }}
      EVENT_ENRICHMENT_LIMIT: "250"
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install enrichment dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Verify OpenAI configuration
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "::error::Missing OPENAI_API_KEY repository secret."
            exit 2
          fi

      - name: Enrich events that need media context
        run: python -u scripts/enrich_event_content_ai.py

      - name: Commit enriched event content
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json \
                  events-preview/rishon-lezion/data/events.json \
                  events-preview/content-enrichment-report.json
          if git diff --cached --quiet; then
            echo "No content enrichment changes."
            exit 0
          fi
          git commit -m "Enrich event content and media briefs"
          for retry in 1 2 3; do
            git fetch origin main
            if git rebase origin/main && git push origin HEAD:main; then
              echo "Content enrichment committed."
              exit 0
            fi
            git rebase --abort || true
            sleep 3
          done
          echo "Could not publish content enrichment" >&2
          exit 1
