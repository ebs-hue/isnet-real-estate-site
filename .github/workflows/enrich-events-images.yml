name: Enrich Ashdod event images

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
  workflow_run:
    workflows:
      - "Daily city event intake"
    types: [completed]
  push:
    branches: [main]
    paths:
      - "scripts/enrich_event_images.py"
      - "scripts/enrich_event_images_v2.py"
      - "scripts/enrich_event_images_v3.py"
      - "scripts/fast_fill_event_images_from_listings.py"
      - "scripts/clean_event_image_placeholders_v2.py"
      - ".github/workflows/enrich-events-images.yml"

permissions:
  contents: write

concurrency:
  group: enrich-ashdod-event-images
  cancel-in-progress: true

jobs:
  enrich:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Source-first editorial rule: search the original event source before
      # reusing any artist/production media-bank image.
      - name: Pull original event images from recorded event sources
        continue-on-error: true
        run: python scripts/enrich_event_images_v3.py

      - name: Recover event-specific images from official source listings
        continue-on-error: true
        run: python scripts/fast_fill_event_images_from_listings.py

      - name: Reuse approved artist or production image only when source lookup failed
        continue-on-error: true
        run: python scripts/reuse_media_bank_images.py --city ashdod

      - name: Remove generic image placeholders
        continue-on-error: true
        run: python scripts/clean_event_image_placeholders_v2.py

      - name: Commit enriched event data
        run: |
          if git diff --quiet -- events-preview/ashdod/data/events.json events-preview/ashdod/data/image-enrichment-report.json; then
            echo "No enrichment changes."
            exit 0
          fi
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json \
                  events-preview/ashdod/data/image-enrichment-report.json \
                  events-preview/ashdod/data/listing-image-fill-report.json \
                  events-preview/ashdod/assets/events
          git commit -m "Enrich Ashdod events with source images"
          # Another automation may have updated main while image enrichment was running.
          # Rebase our generated data commit onto the latest main before pushing.
          git pull --rebase origin main
          git push origin HEAD:main
