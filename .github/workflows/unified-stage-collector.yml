name: Unified Ashdod and Rishon stage event collection
on:
  workflow_dispatch:
  schedule:
    - cron: '05 5 * * *'
  push:
    paths:
      - 'scripts/collect_unified_stage_events.py'
      - '.github/workflows/unified-stage-collector.yml'
permissions:
  contents: write
concurrency:
  group: unified-stage-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect stage information for both cities in one pass
        run: python scripts/collect_unified_stage_events.py
      - name: Check source coverage for safe stage-board replacement
        run: python scripts/audit_stage_rebuild_readiness.py
      - name: Publish matched Ashdod stage media and substantive production descriptions
        env:
          STAGE_MEDIA_PUBLICATION_ENABLED: YES_EXACT_TITLE_DATE_VENUE
        run: python scripts/publish_matched_stage_images.py
      - name: Save collection and published updates together
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/unified-stage-events-ashdod-rishon.json events-preview/ashdod/data/events.json events-preview/admin/data/stage-image-publication-ashdod.json events-preview/admin/data/stage-rebuild-readiness.json
          if ! git diff --cached --quiet; then
            git commit -m "Collect stage candidates and publish verified Ashdod media"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
