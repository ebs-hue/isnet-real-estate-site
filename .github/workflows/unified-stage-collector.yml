name: Unified Ashdod and Rishon stage event collection
on:
  workflow_dispatch:
  schedule:
    - cron: '05 5 * * *'
  push:
    paths:
      - 'scripts/collect_unified_stage_events.py'
      - '.github/workflows/unified-stage-collector.yml'
permissions:
  contents: write
concurrency:
  group: unified-stage-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests beautifulsoup4
      - name: Collect stage information for both cities in one pass
        run: python scripts/collect_unified_stage_events.py
      - name: Save reviewable results without publication
        run: |
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/admin/data/unified-stage-events-ashdod-rishon.json
          if ! git diff --cached --quiet; then
            git commit -m "Update unified Ashdod and Rishon stage event candidates"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
