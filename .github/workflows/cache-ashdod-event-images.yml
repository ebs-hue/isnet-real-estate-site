name: Cache Ashdod event images

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/cache_event_images_allowlisted.py"
      - ".github/workflows/cache-ashdod-event-images.yml"

permissions:
  contents: write

concurrency:
  group: cache-ashdod-event-images
  cancel-in-progress: true

jobs:
  cache:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache verified source images
        run: python scripts/cache_event_images_allowlisted.py

      - name: Commit cached images
        run: |
          if git diff --quiet -- events-preview/ashdod/data/events.json events-preview/ashdod/assets/events; then
            echo "No cache changes."
            exit 0
          fi
          git config user.name "isnet-events-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events-preview/ashdod/data/events.json events-preview/ashdod/assets/events
          git commit -m "Cache Ashdod event source images"
          git push
